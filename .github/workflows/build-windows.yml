name: Installeur Windows

on:
  workflow_dispatch: {}          # bouton « Run workflow » : construit un installeur de test (non publié)
  push:
    tags: ["v*"]                 # tag vX.Y.Z : construit, signe et PUBLIE la Release (utilisée par les mises à jour)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances JavaScript
        run: npm ci

      - name: Tests des crates de calcul
        run: cargo test --lib --tests

      # ── Tag : installeur signé + latest.json publiés dans la Release
      - name: Publier la Release (installeur signé + latest.json)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PoE2 Craft Assistant ${{ github.ref_name }}"
          releaseBody: "Installeur Windows. Les installations existantes proposent la mise à jour au prochain démarrage."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      # ── Lancement manuel : installeur de test, sans publication
      - name: Installeur de test (NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: poe2-craft-assistant-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
