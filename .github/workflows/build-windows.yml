name: Installeur Windows

on:
  workflow_dispatch:             # bouton « Run workflow » : installeur de test (non publié), ou Release si « publish »
    inputs:
      publish:
        description: "Publier la Release vX.Y.Z (version lue dans tauri.conf.json, tag créé sur ce commit)"
        type: boolean
        default: false
  push:
    tags: ["v*"]                 # tag vX.Y.Z : construit, signe et PUBLIE la Release (utilisée par les mises à jour)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances JavaScript
        run: npm ci

      - name: Tests des crates de calcul
        run: cargo test --lib --tests

      # Lancement manuel avec « publish » : même Release qu'un tag poussé, le tag est créé par la publication.
      # Refuse si ce tag existe déjà (ne jamais écraser une Release publiée).
      - name: Vérifier la version à publier
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::le tag v$v existe déjà : passe d'abord la version suivante (node tools/release.mjs X.Y.Z --no-tag)"; exit 1
          fi
          echo "Publication de v$v"

      # ── Tag : installeur signé + latest.json publiés dans la Release
      - name: Publier la Release (installeur signé + latest.json)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ : remplacé par tauri-action par la version de tauri.conf.json (lancement manuel)
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseName: "PoE2 Craft Assistant ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "Installeur Windows. Les installations existantes proposent la mise à jour au prochain démarrage."
          releaseCommitish: ${{ github.sha }}   # tag créé sur ce commit précis (lancement manuel)
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      # ── Lancement manuel : installeur de test, sans publication
      - name: Installeur de test (NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        with:
          name: poe2-craft-assistant-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
