[workspace]
resolver = "2"
members = ["crates/craft-core", "crates/craft-solver", "crates/craft-data", "crates/craft-api", "src-tauri"]
# `cargo test` à la racine ne compile pas la coque Tauri (dépendances système lourdes).
default-members = ["crates/craft-core", "crates/craft-solver", "crates/craft-data", "crates/craft-api"]

[workspace.package]
version = "0.2.11"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 2
